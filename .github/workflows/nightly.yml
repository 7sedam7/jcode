name: Nightly Linux Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: nightly-linux
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"
  JCODE_RELEASE_BUILD: "1"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: jcode-linux-x86_64
            compat_container: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: jcode-linux-aarch64
            compat_container: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark the build as nightly
        shell: bash
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          echo "JCODE_BUILD_SEMVER=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install nightly for emulated TLS
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu
          components: rust-src

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.target }}
          cache-all-crates: "true"

      - name: Install mold linker
        if: matrix.compat_container != true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold

      - name: Build portable Linux x86_64 binary
        if: matrix.compat_container == true
        shell: bash
        run: scripts/build_linux_compat.sh dist
        env:
          JCODE_COMPAT_ARTIFACT: ${{ matrix.artifact }}
          JCODE_COMPAT_ARCH: x86_64

      - name: Build Linux aarch64 binary
        if: matrix.compat_container != true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=mold", "-Z", "tls-model=emulated"]
          EOF
          if command -v sccache >/dev/null 2>&1 && sccache --start-server 2>/dev/null; then
            export RUSTC_WRAPPER=sccache
          fi
          cargo +nightly build -Z build-std=std,panic_abort --release --target "${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/jcode" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish nightly
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jcode-linux-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          test -f jcode-linux-x86_64.tar.gz
          test -f jcode-linux-aarch64.tar.gz
          sha256sum jcode-linux-aarch64.tar.gz jcode-linux-x86_64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Update nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

          notes="Automated Linux nightly build from commit ${GITHUB_SHA}."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --prerelease \
              --title "Nightly" \
              --notes "$notes"
          else
            gh release create nightly \
              --prerelease \
              --title "Nightly" \
              --notes "$notes"
          fi

          gh release upload nightly \
            dist/jcode-linux-x86_64.tar.gz \
            dist/jcode-linux-aarch64.tar.gz \
            dist/SHA256SUMS \
            --clobber
